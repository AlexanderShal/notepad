<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notepad++ iOS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg: #1e1e1e; --bar: #2d2d2d; --text: #f8f8f2; --accent: #007aff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top); }
        .toolbar { background: var(--bar); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d3d3d; z-index: 10; }
        .buttons-group { display: flex; gap: 8px; }
        .btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 500; }
        .btn-secondary { background: #444; }
        select { background: #444; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 13px; }
        .sym-panel { background: #252526; border-bottom: 1px solid #3d3d3d; display: flex; gap: 6px; padding: 8px; overflow-x: auto; z-index: 10; }
        .sym-panel::-webkit-scrollbar { display: none; }
        .sym-btn { background: #3e3e3f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-family: monospace; font-size: 16px; font-weight: bold; min-width: 40px; }
        
        /* Исправление рассинхронизации курсора и добавление строк */
        .editor-container { flex: 1; display: flex; relative; overflow: hidden; background: var(--bg); }
        .line-numbers { width: 45px; background: #1e1e1e; border-right: 1px solid #3d3d3d; color: #858585; text-align: right; padding: 16px 8px 16px 0; font-family: Courier, monospace; font-size: 15px; line-height: 1.5; user-select: none; overflow: hidden; }
        .textarea-wrapper { flex: 1; position: relative; }
        
        /* Свойства textarea и pre должны быть ИДЕНТИЧНЫМИ пиксель-в-пиксель */
        textarea, pre { position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; padding: 16px; border: none; background: transparent; font-family: Courier, monospace; font-size: 15px; line-height: 1.5; white-space: pre; overflow: auto; box-sizing: border-box; }
        textarea { color: transparent; caret-color: #fff; resize: none; outline: none; z-index: 2; -webkit-text-fill-color: transparent; }
        pre { color: var(--text); z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="title">Notepad++ Lite</div>
        <div class="buttons-group">
            <select id="languageSelect" onchange="updateView()">
                <option value="html">HTML</option>
                <option value="text">Plain Text</option>
            </select>
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">Открыть</button>
            <button class="btn" onclick="saveFile()">Сохранить</button>
        </div>
    </div>

    <div class="sym-panel">
        <button class="sym-btn" onclick="insertText('\t')">Tab</button>
        <button class="sym-btn" onclick="insertText('{')">{</button>
        <button class="sym-btn" onclick="insertText('}')">}</button>
        <button class="sym-btn" onclick="insertText('[')">[</button>
        <button class="sym-btn" onclick="insertText(']')">]</button>
        <button class="sym-btn" onclick="insertText('<')">&lt;</button>
        <button class="sym-btn" onclick="insertText('>')">&gt;</button>
        <button class="sym-btn" onclick="insertText(';')">;</button>
        <button class="sym-btn" onclick="insertText('=')">=</button>
        <button class="sym-btn" onclick="insertText('/')">/</button>
    </div>

    <div class="editor-container">
        <div class="line-numbers" id="lineNumbers">1</div>
        <div class="textarea-wrapper">
            <textarea id="editing" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off" oninput="updateView()" onscroll="syncScroll()">&lt;!DOCTYPE html&gt;
<html>
<head>
  <title>Notepad++ iOS</title>
</head>
<body>
  <h1>Все работает ровно!</h1>
</body>
</html></textarea>
            <pre id="highlighting"><code id="code-content"></code></pre>
        </div>
    </div>

    <input type="file" id="fileInput" style="display: none;" onchange="openFile(event)">

    <script>
        const textarea = document.getElementById("editing");
        const codeContent = document.getElementById("code-content");
        const pre = document.getElementById("highlighting");
        const lineNumbers = document.getElementById("lineNumbers");

        function insertText(symbol) {
            const start = textarea.selectionStart, end = textarea.selectionEnd, text = textarea.value;
            textarea.value = text.substring(0, start) + symbol + text.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + symbol.length;
            textarea.focus();
            updateView();
        }

        function updateView() {
            let text = textarea.value;
            if(text[text.length-1] === "\n") { text += " "; }
            
            // Защита от HTML инъекций в превью слоя
            codeContent.textContent = text;
            
            // Обновление номеров строк
            const lines = text.split('\n').length;
            let nums = [];
            for (let i = 1; i <= lines; i++) { nums.push(i); }
            lineNumbers.innerHTML = nums.join('<br>');
            
            syncScroll();
        }

        function syncScroll() {
            pre.scrollTop = textarea.scrollTop;
            pre.scrollLeft = textarea.scrollLeft;
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        function openFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { textarea.value = e.target.result; updateView(); };
            reader.readAsText(file);
        }

        function saveFile() {
            const blob = new Blob([textarea.value], { type: "text/plain;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `script.html`;
            a.click();
        }

        updateView();
    </script>
</body>
</html>
